<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSES Random Practice</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--fg:#1c1c1e;--muted:#6b6b70;--line:#e3e3e6;--accent:#2f6fed;--done:#9a9aa0;--err:#c62828}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16171a;--fg:#ececef;--muted:#9a9aa3;--line:#2c2d32;--accent:#6c9bff;--done:#6b6b73;--err:#ef6b6b}}
:root[data-theme="dark"]{--bg:#16171a;--fg:#ececef;--muted:#9a9aa3;--line:#2c2d32;--accent:#6c9bff;--done:#6b6b73;--err:#ef6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:1}
h1{font-size:18px;margin:0}
#count,#who{color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px}
button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.6;cursor:default}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:12px 0 4px}
.bar>div{height:100%;width:0;background:var(--accent);transition:width .25s}
.tools{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:4px}
.tools label{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--fg)}
.tools input{width:18px;height:18px;accent-color:var(--accent)}
#status{font-size:13px;color:var(--muted);min-height:1.2em}
#status.err{color:var(--err)}
li.hide{display:none}
ol{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
li .n{color:var(--muted);width:2.5em;text-align:right;font-size:13px;flex:none}
li input{width:20px;height:20px;flex:none;cursor:pointer;accent-color:var(--accent)}
li a{color:var(--fg);text-decoration:none;flex:1}
li a:hover{color:var(--accent)}
li.done a{color:var(--done);text-decoration:line-through}
#login{max-width:360px;margin:12vh auto 0}
#login h1{font-size:22px;margin-bottom:6px}
#login p{color:var(--muted);margin:0 0 16px}
#login input{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);margin-bottom:12px}
#login .row{display:flex;gap:8px}
#login .row button{flex:1}
#msg{margin-top:12px;font-size:14px;min-height:1.2em;color:var(--err)}
.themeBtn{padding:8px 10px;line-height:1}
.hidden{display:none!important}
</style>
</head>
<body>
<main>
<section id="login">
  <div style="text-align:right"><button class="ghost themeBtn" aria-label="Toggle light or dark mode" title="Toggle light/dark">&#9680;</button></div>
  <h1>CSES Random Practice</h1>
  <p>Enter your name. Register once, then log in each time.</p>
  <input id="name" type="text" maxlength="30" placeholder="Your name" autocomplete="off" autocapitalize="words">
  <div class="row"><button id="btnLogin">Log in</button><button id="btnReg" class="ghost">Register</button></div>
  <div id="msg"></div>
</section>

<section id="app" class="hidden">
  <header>
    <div><h1>CSES Random Practice</h1><div id="who"></div><div id="count"></div></div>
    <div class="actions"><button id="shuf">Reshuffle</button><button id="out" class="ghost">Log out</button><button class="ghost themeBtn" aria-label="Toggle light or dark mode" title="Toggle light/dark">&#9680;</button></div>
  </header>
  <div class="bar" role="progressbar" aria-label="Solved progress"><div id="fill"></div></div>
  <div class="tools"><span id="pct"></span><label><input type="checkbox" id="hideSolved"> Hide solved</label></div>
  <div id="status"></div>
  <ol id="list"></ol>
</section>
</main>

const P = RAW.split("\n").map(l => { const i = l.indexOf("|"); return {id: l.slice(0, i), name: l.slice(i + 1)}; });
const byId = Object.fromEntries(P.map(p => [p.id, p]));
const $ = id => document.getElementById(id);

// ---------- light/dark toggle (remembered in this browser) ----------
const K_THEME = "cses_theme_v1";
function currentTheme() {
  return document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
try { const t = localStorage.getItem(K_THEME); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
document.querySelectorAll(".themeBtn").forEach(b => b.onclick = () => {
  const t = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem(K_THEME, t); } catch (e) {}
});

let user = null;        // normalized name (primary key)
let order = [], done = {};
let hideSolved = false;
try { hideSolved = localStorage.getItem("cses_hide_v1") === "1"; } catch (e) {}

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const norm = s => s.trim().replace(/\s+/g, " ").toLowerCase();

// ---------- local profiles (stored in this browser) ----------
const K_USERS = "cses_users_v1";
function loadUsers() { try { return JSON.parse(localStorage.getItem(K_USERS)) || {}; } catch (e) { return {}; } }
function saveUsers(u) { try { localStorage.setItem(K_USERS, JSON.stringify(u)); return true; } catch (e) { return false; } }
function setStatus(t, err) { const s = $("status"); s.textContent = t; s.className = err ? "err" : ""; }
function sync(fields) {
  const u = loadUsers(); if (!u[user]) return;
  Object.assign(u[user], fields);
  if (saveUsers(u)) setStatus("Saved"); else setStatus("Could not save: browser storage is blocked.", true);
}

// ---------- auth ----------
function msg(t) { $("msg").textContent = t; }
function validName() {
  const n = norm($("name").value);
  if (n.length < 2) { msg("Please enter a name (at least 2 characters)."); return null; }
  return n;
}
function register() {
  const n = validName(); if (!n) return;
  const u = loadUsers();
  if (u[n]) { msg("That name is already registered. Use Log in."); return; }
  const row = {name: n, display_name: $("name").value.trim().replace(/\s+/g, " "), problem_order: shuffle(P.map(p => p.id)), solved: {}};
  u[n] = row;
  if (!saveUsers(u)) { msg("Could not save: browser storage is blocked."); return; }
  msg(""); start(row);
}
function login() {
  const n = validName(); if (!n) return;
  const u = loadUsers();
  if (!u[n]) { msg("Name not registered yet. Click Register."); return; }
  msg(""); start(u[n]);
}

function start(row) {
  user = row.name;
  done = row.solved || {};
  let o = Array.isArray(row.problem_order) ? row.problem_order.filter(id => byId[id]) : [];
  const have = new Set(o);
  const missing = P.map(p => p.id).filter(id => !have.has(id));
  const changed = missing.length > 0 || o.length !== (row.problem_order || []).length;
  order = o.concat(shuffle(missing));
  $("who").textContent = "Logged in as " + row.display_name;
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  $("hideSolved").checked = hideSolved;
  setStatus("");
  render();
  if (changed) sync({problem_order: order});
}
function logout() {
  user = null; order = []; done = {};
  $("app").classList.add("hidden"); $("login").classList.remove("hidden");
  $("name").value = ""; msg("");
}

// ---------- UI ----------
function updateCount() {
  const n = Object.values(done).filter(Boolean).length, pct = Math.round(n / P.length * 1000) / 10;
  $("count").textContent = n + " / " + P.length + " solved";
  $("fill").style.width = pct + "%";
  $("pct").textContent = pct + "% complete";
}
function render() {
  const list = $("list"); list.innerHTML = "";
  order.forEach((id, i) => {
    const li = document.createElement("li");
    if (done[id]) li.className = "done" + (hideSolved ? " hide" : "");
    const n = document.createElement("span"); n.className = "n"; n.textContent = i + 1;
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!done[id];
    cb.setAttribute("aria-label", "Mark solved");
    cb.onchange = () => {
      if (cb.checked) done[id] = true; else delete done[id];
      li.classList.toggle("done", cb.checked); li.classList.toggle("hide", hideSolved && cb.checked);
      updateCount(); sync({solved: done});
    };
    const a = document.createElement("a");
    a.href = "https://cses.fi/problemset/task/" + id; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.textContent = byId[id].name;
    li.append(n, cb, a); list.appendChild(li);
  });
  updateCount();
}

$("btnLogin").onclick = login;
$("btnReg").onclick = register;
$("name").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
$("out").onclick = logout;
$("hideSolved").onchange = e => {
  hideSolved = e.target.checked;
  try { localStorage.setItem("cses_hide_v1", hideSolved ? "1" : "0"); } catch (err) {}
  render();
};
$("shuf").onclick = () => { order = shuffle(order); render(); window.scrollTo(0, 0); sync({problem_order: order}); };
</script>
